<div class="editors-container">

    <!-- ==========================
         PAGE HEADER
    =========================== -->

    <div class="top">

        <div>
            <h1>Editors</h1>

            <p>
                Total Editors:
                <strong>{{ editors.length }}</strong>
            </p>
        </div>

        <div class="top-actions">

            <button
                class="add-btn"
                (click)="openAddForm()">

                ➕ Add Editor

            </button>

            <button
                class="export-btn"
                (click)="exportEditorsPDF()">

                📄 Export PDF

            </button>

        </div>

    </div>


    <!-- ==========================
         MESSAGES
    =========================== -->

    <div
        class="success-message"
        *ngIf="message">

        {{ message }}

    </div>

    <div
        class="error-message"
        *ngIf="errorMessage">

        {{ errorMessage }}

    </div>


    <!-- ==========================
         LOADING
    =========================== -->

    <div
        class="loading"
        *ngIf="loading">

        Loading editors...

    </div>


    <!-- ==========================
         EDITORS TABLE
    =========================== -->

    <table *ngIf="!loading">

        <thead>

            <tr>

                <th>ID</th>

                <th>Name</th>

                <th>Email</th>

                <th>Status</th>

                <th>Actions</th>

            </tr>

        </thead>


        <tbody>

            <tr
                *ngFor="let editor of editors">

                <td>
                    {{ editor.id }}
                </td>

                <td>
                    {{ editor.name }}
                </td>

                <td>
                    {{ editor.email }}
                </td>

                <td>

                    <span
                        [class.active-status]="
                            editor.status?.toLowerCase() === 'active'
                        "
                        [class.inactive-status]="
                            editor.status?.toLowerCase() === 'inactive'
                        ">

                        {{ editor.status }}

                    </span>

                </td>

                <td>

                    <button
                        class="edit-btn"
                        (click)="openEditForm(editor)">

                        ✏ Edit

                    </button>


                    <button
                        class="status-btn"
                        (click)="toggleStatus(editor)">

                        {{
                            editor.status?.toLowerCase() === 'active'
                            ? '⏸ Deactivate'
                            : '▶ Activate'
                        }}

                    </button>


                    <button
                        class="delete-btn"
                        (click)="deleteEditor(editor)">

                        🗑 Delete

                    </button>

                </td>

            </tr>


            <!-- ==========================
                 EMPTY STATE
            =========================== -->

            <tr
                *ngIf="editors.length === 0">

                <td
                    colspan="5"
                    class="empty">

                    No editors found.

                </td>

            </tr>

        </tbody>

    </table>


    <!-- ==========================
         ADD / EDIT EDITOR MODAL
    =========================== -->

    @if(showForm){

        <div class="modal-overlay">

            <div class="modal">

                <h2>

                    {{
                        isEditing
                        ? 'Edit Editor'
                        : 'Add Editor'
                    }}

                </h2>


                <!-- NAME -->

                <div class="form-group">

                    <label>
                        Name
                    </label>

                    <input
                        type="text"
                        [(ngModel)]="name"
                        placeholder="Enter editor name">

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label>
                        Email
                    </label>

                    <input
                        type="email"
                        [(ngModel)]="email"
                        placeholder="Enter editor email">

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label>

                        Password

                        @if(isEditing){

                            <small>
                                Leave blank to keep current password.
                            </small>

                        }

                    </label>

                    <input
                        type="password"
                        [(ngModel)]="password"
                        placeholder="Enter password">

                </div>


                <!-- MODAL BUTTONS -->

                <div class="modal-buttons">

                    <button
                        class="cancel-btn"
                        (click)="closeForm()">

                        Cancel

                    </button>


                    <button
                        class="save-btn"
                        (click)="saveEditor()">

                        {{
                            isEditing
                            ? 'Save Changes'
                            : 'Create Editor'
                        }}

                    </button>

                </div>

            </div>

        </div>

    }

</div>
