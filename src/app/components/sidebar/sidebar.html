<div class="sidebar">

    <!-- Logo -->

    <div class="logo">

        <div class="logo-icon">
            <i class="fa-solid fa-envelope-open-text"></i>
        </div>

        <h2>ZIP ZIP INFO</h2>

    </div>

    <!-- Navigation -->

    <ul>

        <li routerLink="/dashboard" routerLinkActive="active">

            <i class="fa-solid fa-house"></i>

            <span>Dashboard</span>

        </li>

        <li routerLink="/subscribers" routerLinkActive="active">

            <i class="fa-solid fa-users"></i>

            <span>Subscribers</span>

        </li>

        <li routerLink="/newsletters" routerLinkActive="active">

            <i class="fa-solid fa-paper-plane"></i>

            <span>Publish Newsletter</span>

        </li>

        <li routerLink="/manage-newsletters" routerLinkActive="active">

            <i class="fa-solid fa-newspaper"></i>

            <span>Manage Newsletters</span>

        </li>

        <li routerLink="/reports" routerLinkActive="active">

            <i class="fa-solid fa-chart-column"></i>

            <span>Reports</span>

        </li>

        <li routerLink="/help-support" routerLinkActive="active">

            <i class="fa-solid fa-headset"></i>

            <span>Help & Support</span>

        </li>

        <li routerLink="/settings" routerLinkActive="active">

            <i class="fa-solid fa-gear"></i>

            <span>Settings</span>

        </li>

    </ul>

    <!-- Bottom Section -->

    <div class="sidebar-bottom">

        <div class="admin-profile">

            <div class="profile-icon">

                <i class="fa-solid fa-user-shield"></i>

            </div>

            <div>

                <h4>Administrator</h4>

                <small>Online</small>

            </div>

        </div>

        <button class="logout-btn" (click)="logout()">

            <i class="fa-solid fa-right-from-bracket"></i>

            Logout

        </button>

    </div>

</div>
