<div class="login-page">

  <div class="login-card">

    <div class="logo">
      📬
    </div>

    <h1>ZIP ZIP INFO</h1>

    <p class="subtitle">
      Newsletter Management System
    </p>

    <h2>Welcome Back</h2>

    <p class="login-text">
      Login to continue to your portal
    </p>

    <form (ngSubmit)="login()">

      <div class="form-group">

        <label for="email">
          Email
        </label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Enter your email"
          autocomplete="email"
        >

      </div>

      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Enter your password"
          autocomplete="current-password"
        >

      </div>

      <div
        class="error-message"
        *ngIf="errorMessage"
      >
        {{ errorMessage }}
      </div>

      <button
        type="submit"
        [disabled]="loading"
      >

        {{ loading ? 'Logging in...' : 'Login' }}

      </button>

      <div class="register-link">

  <span>Don't have an account? </span>

  <button
    type="button"
    class="register-button"
    (click)="goToRegister()"
  >
    Register as Subscriber
  </button>

</div>

    </form>

  </div>

</div>
