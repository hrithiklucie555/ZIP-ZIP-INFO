<div class="forgot-page">

  <div class="forgot-card">

    <!-- Logo -->

    <div class="logo">
      📬
    </div>


    <h1>
      ZIP ZIP INFO
    </h1>

    <p class="subtitle">
      Newsletter Management System
    </p>


    <h2>
      Forgot Password?
    </h2>

    <p class="description">
      Enter your registered email and choose a new password.
    </p>


    <form
      (ngSubmit)="resetPassword()"
    >

      <!-- Email -->

      <div class="form-group">

        <label for="email">
          Email
        </label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Enter your registered email"
          autocomplete="email"
        >

      </div>


      <!-- New Password -->

      <div class="form-group">

        <label for="newPassword">
          New Password
        </label>

        <input
          id="newPassword"
          type="password"
          name="newPassword"
          [(ngModel)]="newPassword"
          placeholder="Enter new password"
          autocomplete="new-password"
        >

      </div>


      <!-- Confirm Password -->

      <div class="form-group">

        <label for="confirmPassword">
          Confirm Password
        </label>

        <input
          id="confirmPassword"
          type="password"
          name="confirmPassword"
          [(ngModel)]="confirmPassword"
          placeholder="Confirm new password"
          autocomplete="new-password"
        >

      </div>


      <!-- Success -->

      <div
        class="success-message"
        *ngIf="message"
      >
        {{ message }}
      </div>


      <!-- Error -->

      <div
        class="error-message"
        *ngIf="errorMessage"
      >
        {{ errorMessage }}
      </div>


      <!-- Reset -->

      <button
        type="submit"
        [disabled]="loading"
        class="reset-button"
      >

        {{
          loading
            ? 'Resetting Password...'
            : 'Reset Password'
        }}

      </button>


      <!-- Back -->

      <button
        type="button"
        class="back-button"
        (click)="backToLogin()"
      >
        ← Back to Login
      </button>

    </form>

  </div>

</div>
